<title>Bear Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column. The LED screen, then the care button docked under it. */
:root {
  --bg: #0B0C09;      /* behind the LEDs */
  --lit: #DCE4C6;     /* lit LED */
  --dim: #7D846F;     /* dim LED */
  --off: #1C1F18;     /* unlit LED */
  --line: #2A2E24;    /* control outlines */
  --face: #23271F;    /* top of the care button */
  --face-edge: #3A4033;
  --wall: #121410;    /* side of the care button */
  --chip: #171A13;    /* menu options */
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--lit); }
[hidden] { display: none !important; }
body {
  font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 392px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.name { font-family: var(--font-data); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; padding: 6px 12px; color: var(--dim); white-space: nowrap; }
.tabs button[aria-pressed="true"] { background: var(--off); color: var(--lit); }
button {
  font: inherit; font-size: 14px; color: var(--lit); background: transparent;
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--dim); outline-offset: 2px; }

/* LED screen */
.stage { position: relative; }
#scene { display: block; width: 100%; max-width: 100%; border-radius: 20px; touch-action: none; user-select: none; -webkit-user-select: none; }
.scrim {
  position: absolute; inset: 0; border-radius: 20px; background: rgba(11, 12, 9, 0.6);
  opacity: 0; pointer-events: none; transition: opacity 160ms ease;
}
.menu-open .scrim { opacity: 1; pointer-events: auto; }

/* Care button: a raised face on a visible wall that sinks when pressed. */
.dock { position: relative; height: 112px; display: flex; justify-content: center; align-items: flex-start; padding-top: 10px; }
.press {
  position: relative; width: 84px; height: 84px; padding: 0; border: 0; border-radius: 50%;
  background: var(--wall);
  box-shadow: 0 0 0 1px var(--line), 0 10px 22px rgba(0, 0, 0, 0.55);
  touch-action: none; user-select: none; -webkit-user-select: none; z-index: 3;
}
.press .face {
  position: absolute; inset: 0; border-radius: 50%;
  background: var(--face);
  box-shadow: inset 0 1px 0 var(--face-edge), 0 0 0 1px #2E3329;
  display: grid; place-items: center;
  transform: translateY(-8px);
  transition: transform 70ms ease-out, background 120ms ease;
}
.press.down .face { transform: translateY(-1px); transition-duration: 40ms; }
.menu-open .press .face { background: #2B3026; }
.press canvas { width: 36px; height: 36px; display: block; }

/* Menu: options fan out in an arc above the button. */
.menu { position: absolute; left: 50%; top: 52px; width: 0; height: 0; z-index: 2; }
.option {
  position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; padding: 0;
  border-radius: 50%; border: 1px solid var(--line); background: var(--chip);
  display: grid; place-items: center;
  opacity: 0; pointer-events: none;
  transform: translate(0, 0) scale(0.3);
  transition: transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 140ms ease, background 100ms ease, border-color 100ms ease;
}
.option canvas { width: 32px; height: 32px; display: block; }
.menu-open .option { opacity: 1; pointer-events: auto; transform: translate(var(--x), var(--y)) scale(1); }
.menu-open .option.hot { background: var(--face); border-color: var(--lit); transform: translate(var(--x), var(--y)) scale(1.16); }
.menu-open .option:disabled { opacity: 0.35; }
.menu-label {
  position: absolute; left: -110px; width: 220px; top: -214px; text-align: center;
  display: flex; flex-direction: column; gap: 2px;
  opacity: 0; transform: translateY(6px); transition: opacity 140ms ease, transform 160ms ease; pointer-events: none;
}
.menu-open .menu-label { opacity: 1; transform: none; }
.menu-label b { font-weight: 500; font-size: 16px; }
.menu-label span { font-size: 12px; color: var(--dim); }

.status { font-family: var(--font-data); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: center; }
.dev { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.dev span { font-family: var(--font-data); font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
.dev button { font-size: 12px; padding: 4px 10px; color: var(--dim); }
.glyph { display: flex; gap: 16px; align-items: center; background: var(--off); border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.5; color: var(--dim); }
.glyph b { color: var(--lit); font-weight: 500; }
#glyph { width: 112px; height: 112px; flex: none; border-radius: 50%; cursor: pointer; }

/* Character sheet */
.sheet { display: flex; flex-direction: column; gap: 6px; }
.sheet h2 { font-size: 15px; font-weight: 500; margin: 14px 0 2px; }
.row { display: flex; flex-direction: column; gap: 4px; }
.row .label { font-size: 12px; color: var(--dim); }
.bears { display: flex; gap: 10px; align-items: flex-end; }
.bear { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bear canvas { display: block; }
.bear span { font-family: var(--font-data); font-size: 10px; color: var(--dim); }
footer { font-family: var(--font-data); font-size: 11px; color: var(--dim); text-align: center; }
@media (prefers-reduced-motion: reduce) {
  .option, .menu-label, .press .face, .scrim { transition: none; }
}
</style>

<div class="wrap">
  <header>
    <span class="name">Bear</span>
    <div class="tabs" role="group" aria-label="View">
      <button id="tab-scene" aria-pressed="true">Scene</button>
      <button id="tab-sheet" aria-pressed="false">Character sheet</button>
    </div>
  </header>

  <section id="view-scene" class="wrap">
    <div class="stage">
      <canvas id="scene" aria-label="Bear scene: tap the bear to pat it, swipe the ball up to throw"></canvas>
      <div class="scrim" id="scrim"></div>
    </div>
    <div class="dock">
      <div class="menu" id="menu" role="menu" aria-label="Care">
        <div class="menu-label" aria-live="polite"><b id="menu-title">Care</b><span id="menu-hint">Slide to an option and let go</span></div>
      </div>
      <button class="press" id="care" aria-haspopup="menu" aria-expanded="false" aria-label="Care menu: press and hold">
        <span class="face"><canvas id="care-icon"></canvas></span>
      </button>
    </div>
    <div class="status" id="status">wander · calm</div>
    <div class="dev">
      <span>Debug</span>
      <button id="worry">Make it worry</button>
      <button id="age">Show adult</button>
    </div>
    <div class="glyph">
      <canvas id="glyph" aria-label="Glyph Matrix mirror: tap to press the Glyph Button"></canvas>
      <div><b>Glyph Matrix, 25 × 25</b><br>Mirrors the bear on the front. Tap it to press the Glyph Button.</div>
    </div>
  </section>

  <section id="view-sheet" class="sheet" hidden></section>

  <footer id="version">/*BEAR_VERSION*/</footer>
</div>

<script type="module">
/*BEAR_SCRIPT*/
</script>
