<title>Bear Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column, the LED screen first, controls under it, like the app. */
:root {
  --bg: #0B0C09;      /* behind the LEDs */
  --lit: #DCE4C6;     /* lit LED */
  --dim: #7D846F;     /* dim LED */
  --off: #1C1F18;     /* unlit LED */
  --line: #2A2E24;    /* control outlines */
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--lit); }
[hidden] { display: none !important; }
body {
  font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
.wrap { max-width: 392px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.name { font-family: var(--font-data); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; padding: 6px 12px; color: var(--dim); white-space: nowrap; }
.tabs button[aria-pressed="true"] { background: var(--off); color: var(--lit); }
button {
  font: inherit; font-size: 14px; color: var(--lit); background: transparent;
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--dim); outline-offset: 2px; }
#scene { display: block; width: 100%; max-width: 100%; border-radius: 20px; touch-action: none; user-select: none; -webkit-user-select: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.status { font-family: var(--font-data); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.glyph { display: flex; gap: 16px; align-items: center; background: var(--off); border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.5; color: var(--dim); }
.glyph b { color: var(--lit); font-weight: 500; }
#glyph { width: 112px; height: 112px; flex: none; border-radius: 50%; cursor: pointer; }
.sheet { display: flex; flex-direction: column; gap: 6px; }
.sheet h2 { font-size: 15px; font-weight: 500; margin: 14px 0 2px; }
.row { display: flex; flex-direction: column; gap: 4px; }
.row .label { font-size: 12px; color: var(--dim); }
.bears { display: flex; gap: 10px; align-items: flex-end; }
.bear { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bear canvas { display: block; }
.bear span { font-family: var(--font-data); font-size: 10px; color: var(--dim); }
footer { font-family: var(--font-data); font-size: 11px; color: var(--dim); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header>
    <span class="name">Bear</span>
    <div class="tabs" role="group" aria-label="View">
      <button id="tab-scene" aria-pressed="true">Scene</button>
      <button id="tab-sheet" aria-pressed="false">Character sheet</button>
    </div>
  </header>

  <section id="view-scene" class="wrap">
    <canvas id="scene" aria-label="Bear scene: tap the bear to pat it, swipe the ball up to throw"></canvas>
    <div class="controls">
      <button id="feed">Feed</button>
      <button id="worry">Make it worry</button>
      <button id="age">Show adult</button>
    </div>
    <div class="status" id="status">wander · calm</div>
    <div class="glyph">
      <canvas id="glyph" aria-label="Glyph Matrix mirror: tap to press the Glyph Button"></canvas>
      <div><b>Glyph Matrix, 25 × 25</b><br>Mirrors the bear on the front. Tap it to press the Glyph Button.</div>
    </div>
  </section>

  <section id="view-sheet" class="sheet" hidden></section>

  <footer id="version">/*BEAR_VERSION*/</footer>
</div>

<script type="module">
/*BEAR_SCRIPT*/
</script>
